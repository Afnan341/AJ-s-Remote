name: AJ's Remote APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir extracted
          unzip AJsRemote_Integration_Review.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses

      - name: Install SDK 35
        run: "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Run tests and build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJ-Remote-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
