
name: AJ's Remote APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir extracted
          unzip AJsRemote_Integration_Review.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Run tests and build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJ-Remote-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
